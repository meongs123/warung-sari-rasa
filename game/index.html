<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23C65A21'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23FFF3D6'%3E%E2%8D%BB%3C/text%3E%3C/svg%3E">
<title>Warung Sari Rasa — Dapur Kilat</title>
<style>
  html, body { margin: 0; padding: 0; background: #2E1F14; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas {
    display: block;
    background: #F7E8C8;
    image-rendering: auto;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script>
  // Letterbox scaling: the logical canvas stays 1280x720, scaled to fit.
  function fit() {
    const canvas = document.getElementById('game');
    const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    canvas.style.width = Math.floor(1280 * scale) + 'px';
    canvas.style.height = Math.floor(720 * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
<!-- Phaser 4.2.1, vendored locally (game/lib/phaser.min.js) — no CDN, no
     network. Loaded before the module script so `Phaser` is global when
     main.js boots the game. -->
<script src="./lib/phaser.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
